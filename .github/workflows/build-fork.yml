name: build-fork

# 构建本 fork 的镜像并推送到 GHCR，让服务器可以直接 `docker pull`，
# 不必在服务器上跑 npm ci + pip（那是最慢的一步）。
#
# 触发：push 到 main，或在 Actions 页面手动运行。
#
# 产物：
#   ghcr.io/dabai214109/university-helper-app:latest  (+ :main, :sha-xxxx)
#   ghcr.io/dabai214109/university-helper-web:latest  (+ :main, :sha-xxxx)
#
# ⚠️ 首次运行后必须手动把这两个 package 设为 Public，否则服务器匿名拉取会 401：
#    GitHub → 个人头像 → Your packages → university-helper-app → Package settings
#    → Change visibility → Public（web 同理）
#
# 只构建 linux/amd64：服务器都是 x86_64，多架构构建会慢一倍且没有必要。
# 需要 arm 时把 PLATFORMS 改回来。

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  OWNER: dabai214109
  APP_IMAGE: ghcr.io/dabai214109/university-helper-app
  WEB_IMAGE: ghcr.io/dabai214109/university-helper-web
  PLATFORMS: linux/amd64

jobs:
  build-app:
    name: build app image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.APP_IMAGE }}
          tags: |
            type=raw,value=latest
            type=raw,value=main
            type=sha,prefix=sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile.server
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app

      # Servers behind a blocked CDN can reach github.com but not the registry's
      # blob host, so `docker pull` hangs on the layers even though the image
      # exists. Export a plain tar.gz here: it travels over github.com's release
      # asset path instead, and needs neither Docker nor a build on the server
      # (a 1 GB box cannot build this).
      - name: Export image for offline install
        run: |
          docker pull --platform linux/amd64 "${{ env.APP_IMAGE }}:latest"
          docker save "${{ env.APP_IMAGE }}:latest" | gzip -1 > app-image.tar.gz
          ls -lh app-image.tar.gz

      - name: Upload app image
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: app-image
          path: app-image.tar.gz
          retention-days: 14
          if-no-files-found: error

  build-web:
    name: build web image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.WEB_IMAGE }}
          tags: |
            type=raw,value=latest
            type=raw,value=main
            type=sha,prefix=sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile.web
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Export image for offline install
        run: |
          docker pull --platform linux/amd64 "${{ env.WEB_IMAGE }}:latest"
          docker save "${{ env.WEB_IMAGE }}:latest" | gzip -1 > web-image.tar.gz
          ls -lh web-image.tar.gz

      - name: Upload web image
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-image
          path: web-image.tar.gz
          retention-days: 14
          if-no-files-found: error

  # 构建完成后给一个明确结论，省得去翻日志
  summary:
    name: summary
    runs-on: ubuntu-latest
    needs: [build-app, build-web]
    steps:
      - name: Report
        run: |
          echo "### 镜像已推送" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ env.APP_IMAGE }}:latest" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ env.WEB_IMAGE }}:latest" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**首次使用前**：把这两个 package 的可见性改成 Public，" >> "$GITHUB_STEP_SUMMARY"
          echo "否则服务器 \`docker pull\` 会返回 401。" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### 服务器拉不动 GHCR 时" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "本次运行底部有两个 artifact：\`app-image\` / \`web-image\`（各含一个 .tar.gz）。" >> "$GITHUB_STEP_SUMMARY"
          echo "浏览器下载 → 宝塔上传到 \`/www/wwwroot/uh/images/\` → 服务器执行：" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "gunzip -c app-image.tar.gz | docker load" >> "$GITHUB_STEP_SUMMARY"
          echo "gunzip -c web-image.tar.gz | docker load" >> "$GITHUB_STEP_SUMMARY"
          echo "docker compose up -d --pull never" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "详见仓库根目录的 \`镜像上传部署教程.md\`。" >> "$GITHUB_STEP_SUMMARY"
